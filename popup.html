<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatGPT Visual Exporter</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }

      body {
        width: 290px;
        margin: 0;
        padding: 16px;
      }

      h1 {
        font-size: 16px;
        margin: 0 0 5px;
      }

      p {
        margin: 0 0 12px;
        font-size: 12px;
        line-height: 1.45;
        opacity: 0.78;
      }

      button {
        display: block;
        width: 100%;
        margin: 8px 0;
        padding: 10px 12px;
        text-align: left;
        font: inherit;
        font-size: 13px;
        border: 1px solid #8888;
        border-radius: 8px;
        background: transparent;
        cursor: pointer;
      }

      button:hover {
        background: #80808018;
      }

      button:disabled {
        opacity: 0.45;
        cursor: default;
      }

      #status {
        min-height: 18px;
        margin-top: 10px;
        font-size: 12px;
      }
    </style>
    <script src="popup.js" defer></script>
  </head>
  <body>
    <h1>ChatGPT Visual Exporter</h1>
    <p>
      Download one styled HTML file. Open it to print either a white PDF or the
      original theme.
    </p>

    <button data-mode="conversation">Export entire conversation</button>
    <button data-mode="message">Pick a message</button>
    <button data-mode="element">Pick a diagram or element</button>

    <div id="status" role="status" aria-live="polite"></div>
  </body>
</html>
